name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Tests de regresión
        run: |
          uv run python -m unittest discover -s tests -p '*test*.py' -v
          uv run python tests/test_docs_remit.py

      - name: Smoke (pipeline + validador + evaluador oficial sobre la muestra)
        run: uv run python scripts/smoke.py | tee smoke.log && grep -q "SMOKE VERDE" smoke.log
